name: Scrape & Deploy Telegram Lucky

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run full mirror scrape (--full)"
        required: false
        default: "false"
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "lucky-pages"
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scrape configured channels
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            bun run scrape --full || true
          else
            bun run scrape || true
          fi

      - name: Commit updated JSONL data
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/*.jsonl
            git commit -m "data: Update scraped Telegram channel posts"
            git push
          fi

      - name: Build static site
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
