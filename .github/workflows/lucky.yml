name: Scrape & Deploy Telegram Lucky

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run full mirror scrape (--full)"
        required: false
        default: "false"
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "lucky-pages"
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scrape configured channels
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            bun run scrape --full || true
          else
            bun run scrape || true
          fi

      - name: Commit updated JSONL data
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/*.jsonl
            git commit -m "data: Update scraped Telegram channel posts"
            git push
          fi

      - name: Build static site
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
